name: Daily ecosystem update

on:
  schedule:
    - cron: "17 9 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

concurrency:
  group: ecosystem-radar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Refresh GitHub data and rebuild artifacts
        run: npm run update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run check
      - name: Commit daily snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md STATUS.md tweet-draft.md data docs
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore(data): daily ecosystem snapshot $(date -u +%F)"
            git push
          fi
      - name: Upload GitHub Pages artifact
        if: ${{ vars.ENABLE_GITHUB_PAGES == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy-pages:
    if: ${{ vars.ENABLE_GITHUB_PAGES == 'true' }}
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

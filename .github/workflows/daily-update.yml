name: Daily ecosystem update

on:
  schedule:
    - cron: "17 9 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

concurrency:
  group: ecosystem-radar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - name: Refresh GitHub data and rebuild artifacts
        run: npm run update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run check
      - run: npm run security-check
      - name: Commit daily snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md STATUS.md tweet-draft.md data docs
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            SNAPSHOT_DATE="$(TZ=Asia/Shanghai date +%F)"
            git commit -m "chore(data): daily ecosystem snapshot ${SNAPSHOT_DATE}"
            git push
          fi
